name: Windows Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install CMake
      uses: crazy-max/ghaction-chocolatey@v2
      with:
        args: install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

    - name: Install Conan 1.x
      run: pip install "conan==1.59.0"

    - name: Configure Conan
      run: |
        conan profile new default --detect --force
        conan remote add bincrafters https://api.bintray.com/conan/bincrafters/public-conan

    - name: Build Standard Version
      run: |
        # 创建构建目录
        mkdir build
        cd build
        conan install .. --build=outdated -s compiler.cppstd=17
        conan build ..

    - name: Build Qt Version
      run: |
        conan export conanfile.py josh/testing
        cd qt_wrap
        mkdir build
        cd build
        conan install .. --build=outdated -s compiler.cppstd=17
        conan build ..
