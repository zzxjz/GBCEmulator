name: Windows Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install CMake
      uses: actions/setup-cmake@v2
      with:
        cmake-version: '3.x'

    - name: Install Conan
      run: pip install conan --user

    - name: Add Conan remote
      run: conan remote add bincrafters https://api.bintray.com/conan/bincrafters/public-conan

    - name: Install dependencies
      run: conan install . -if=build --build=outdated -s compiler.cppstd=17

    - name: Build project
      run: conan build . -bf=build

  build-qt:
    runs-on: windows-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install CMake
      uses: actions/setup-cmake@v2
      with:
        cmake-version: '3.x'

    - name: Install Conan
      run: pip install conan --user

    - name: Add Conan remote
      run: conan remote add bincrafters https://api.bintray.com/conan/bincrafters/public-conan

    - name: Export conanfile
      run: conan export conanfile.py josh/testing

    - name: Change to qt_wrap directory
      run: cd qt_wrap

    - name: Install Qt dependencies
      run: conan install . -if=build --build=outdated -s compiler.cppstd=17

    - name: Build Qt project
      run: conan build . -bf=build
